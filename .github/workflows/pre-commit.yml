# Compliant with [AI-GUIDELINES.md](../../.ai/AI-GUIDELINES.md) v0921d4cfab198af1451ef177b6e47657b5d3ab0292f77bf232496291dee47183

name: pre-commit

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-core:
    name: Run Core Workflow
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: password
      DB_USERNAME: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 54321
      DB_DATABASE: chrrprr
      DB_SCHEMA: public
      DB_SEARCH_SCHEMA: public
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chrrprr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          PGUSER: postgres
        ports:
          - 54321:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.17

      - name: Configure Composer Auth
        env:
          FLUXUI_PRO_USERNAME: ${{ secrets.FLUXUI_PRO_USERNAME }}
          FLUXUI_PRO_KEY: ${{ secrets.FLUXUI_PRO_KEY }}
          GH_COMPOSER_TOKEN: ${{ secrets.GH_COMPOSER_TOKEN }}
          SPATIE_USERNAME: ${{ secrets.SPATIE_USERNAME }}
          SPATIE_COMMENTS_KEY: ${{ secrets.SPATIE_COMMENTS_KEY }}
        run: |
          if [[ -z "$FLUXUI_PRO_USERNAME" || -z "$FLUXUI_PRO_KEY" || -z "$GH_COMPOSER_TOKEN" || -z "$SPATIE_USERNAME" || -z "$SPATIE_COMMENTS_KEY" ]]; then
            echo "::error::Missing Composer auth secrets"
            exit 1
          fi

          composer config http-basic.composer.fluxui.dev "$FLUXUI_PRO_USERNAME" "$FLUXUI_PRO_KEY"
          composer config github-oauth.github.com "$GH_COMPOSER_TOKEN"
          composer config http-basic.satis.spatie.be "$SPATIE_USERNAME" "$SPATIE_COMMENTS_KEY"
          composer config http-basic.composer.satis.spatie.be "$SPATIE_USERNAME" "$SPATIE_COMMENTS_KEY"

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Bun Dependencies
        run: bun install --frozen-lockfile

      - name: Build Assets
        run: bun run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Test Environment
        run: |
          rm -f .env .env.testing
          cp .env.example .env.testing
          # Override DB_PORT to match CI service port mapping (54321:5432)
          sed -i 's|^DB_PORT=.*|DB_PORT=54321|' .env.testing
          php artisan key:generate --env=testing

      - name: Setup Test Database
        run: |
          export DB_SCHEMA=public
          export DB_SEARCH_SCHEMA=public
          php artisan migrate:fresh --env=testing --force

      - name: Run Core Workflow Suite
        run: composer run test:core

      - name: Run Behat Unit Tests
        run: composer behat:unit

      - name: Run Behat API Tests
        run: composer behat:api
