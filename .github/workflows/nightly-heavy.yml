name: nightly heavy-suite

on:
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-quality:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.17

      - name: Configure Composer Auth
        env:
          FLUXUI_PRO_USERNAME: ${{ secrets.FLUXUI_PRO_USERNAME }}
          FLUXUI_PRO_KEY: ${{ secrets.FLUXUI_PRO_KEY }}
          GH_COMPOSER_TOKEN: ${{ secrets.GH_COMPOSER_TOKEN }}
        run: |
          if [[ -z "$FLUXUI_PRO_USERNAME" || -z "$FLUXUI_PRO_KEY" || -z "$GH_COMPOSER_TOKEN" ]]; then
            echo "::error::Missing FLUXUI_PRO_... or GH_COMPOSER_TOKEN secrets"
            exit 1
          fi

          composer config http-basic.composer.fluxui.dev "$FLUXUI_PRO_USERNAME" "$FLUXUI_PRO_KEY"
          composer config github-oauth.github.com "$GH_COMPOSER_TOKEN"

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          bun install --frozen-lockfile

      - name: Build Assets
        run: bun run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed

      - name: Setup Test Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Setup Test Database for Behat
        run: |
          php artisan migrate:fresh --env=testing --force

      - name: Run Heavy Tier Workflow
        timeout-minutes: 60
        # For faster nightly runs (Infection only), use: composer run test:heavy:nightly
        run: composer run test:heavy

      - name: Run Behat Unit Tests
        run: composer behat:unit

      - name: Run Behat API Tests
        run: composer behat:api

      - name: Setup Browser Server for Behat
        run: |
          google-chrome --version || echo "Chrome not found, will use Playwright"
          google-chrome --remote-debugging-port=9222 --headless --no-sandbox --disable-dev-shm-usage --disable-gpu > /dev/null 2>&1 &
          sleep 2

      - name: Run Behat Browser Tests
        run: composer behat:browser
        continue-on-error: true

      - name: Upload Behat Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-nightly-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore

      - name: Upload Behat Output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-nightly-output
          path: |
            features/**/*.feature
            behat.yml
          if-no-files-found: ignore

      - name: Upload Mutation Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-test-reports
          path: |
            infection.html
            infection-summary.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Run Pest Architecture Tests (Optional - May Timeout)
        continue-on-error: true
        timeout-minutes: 20
        run: composer run test:arch:pest
