php-version = "8.5"
stack-size = 8388608
allow-unsupported-php-version = true
threads = 1

[source]
includes = ["vendor"]
paths = ["app", "bootstrap", "config", "database", "public", "resources", "routes", "tests"]
excludes = [
    "storage",
    "tmp",
    "node_modules",
    "bootstrap/cache",
    "database/migrations",
]
extensions = ["php"]

[linter]
# Configure linter rules
integrations = ["laravel", "phpunit"]

[linter.rules]
"no-literal-password" = { enabled = false }
"prefer-anonymous-migration" = { enabled = false }
"class-name" = { enabled = false }
"literal-named-argument" = { enabled = false }

[formatter]
# Note: Mago's formatter is NOT used - Pint is the authoritative formatter
# These settings are kept for reference but Mago format is not run in lint/lintfix
# Pint handles all formatting to ensure Laravel style compliance
print-width = 120  # Laravel default line length (matches Pint's default)
use-tabs = false   # Use spaces (Laravel/Pint standard - 4 spaces per indent)

# Guard/Architectural rules (documented here, though guard subcommand is missing in 0.26.1)
# Enforces code structure and dependency rules
# [guard]
# excludes = ["database", "tests", "resources/views", "routes", "bootstrap"]

# Perimeter rules: Control namespace dependencies
# These rules ensure proper layer separation and dependency management

# Routes files (global namespace) can use Laravel framework, Livewire, and all vendor packages
