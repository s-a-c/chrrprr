php_version = "8.2"
stack_size = 64
allow_unsupported_php_version = true
threads = 1

[source]
includes = ["vendor"]
paths = ["app", "bootstrap", "config", "database", "public", "resources", "routes", "tests"]
excludes = [
    "storage",
    "tmp",
    "node_modules",
    "bootstrap/cache",
]
extensions = ["php"]

[linter]
# Configure linter rules
plugins = ["consistency", "naming"]

[[linter.rules]]
name = "security/no-literal-password"
enabled = false

[[linter.rules]]
name = "prefer-anonymous-migration"
enabled = false

[[linter.rules]]
name = "consistency/class-name"
enabled = false

[[linter.rules]]
name = "analysis/undefined-function-or-method"
enabled = false

[[linter.rules]]
name = "best-practices/literal-named-argument"
enabled = false

[format]
print_width = 120
use_tabs = false

# Guard/Architectural rules (documented here, though guard subcommand is missing in 0.26.1)
# Enforces code structure and dependency rules
# [guard]
# excludes = ["database", "tests", "resources/views", "routes", "bootstrap"]

# Perimeter rules: Control namespace dependencies
