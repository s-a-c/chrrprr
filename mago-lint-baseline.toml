# Mago Linting Baseline
# =====================
# This baseline file records known linting issues that are acceptable in the codebase.
# When mago runs with `--baseline`, it will ignore issues listed here and only report new issues.
#
# Purpose:
# - Focus on new issues introduced going forward
# - Acknowledge existing architectural decisions and patterns
# - Reduce noise from acceptable code patterns
#
# Usage:
#   mago --config mago.toml lint --baseline mago-lint-baseline.toml
#
# Regeneration:
#   mago --config mago.toml lint --generate-baseline --baseline mago-lint-baseline.toml
#
# Last Updated: 2025-01-23

variant = "loose"

# ============================================================================
# Issue Categories Being Baselined
# ============================================================================
#
# 1. no-else-clause (15 occurrences)
#    - Architectural: Else clauses are used intentionally for clarity in some contexts
#    - Some are in migrations where refactoring isn't practical
#    - Can be addressed incrementally during refactoring
#
# 2. cyclomatic-complexity (3 occurrences)
#    - HasTeamHierarchy trait: Complexity 19 (threshold 15) - Business logic trait
#    - TeamMoveService: Complexity 21 (threshold 15) - Orchestrates complex workflows
#    - TeamNameValidator: Complexity 21 (threshold 15) - Handles complex name validation logic
#    - These represent intentional architectural decisions for cohesive business logic
#
# 3. too-many-methods (3 occurrences)
#    - User model: 12 methods (threshold 10) - Appropriate for Eloquent model with relationships
#    - TeamMoveService: 15 methods (threshold 10) - Orchestrates complex business logic
#    - TeamNameValidator: 13 methods (threshold 10) - Well-structured validation with focused methods
#    - Splitting would reduce cohesion and make code harder to follow
#
# 4. kan-defect (2 occurrences)
#    - HasTeamHierarchy trait: Score 2.04 - Related to cyclomatic complexity
#    - TeamNameValidator: Score 1.68 - Complex validation logic for team names
#    - Architectural decisions for cohesive business logic
#
# 5. halstead (3 occurrences)
#    - Complexity metric warnings for complex methods
#    - Acceptable for business logic that requires comprehensive handling
#
# 6. prefer-first-class-callable (3 occurrences)
#    - ManagesTeamRoles.php: Closures execute query logic, cannot use first-class callable syntax
#    - These are false positives - closures perform work, not just forward arguments
#
# 7. assertion-style (8 occurrences)
#    - Test files using self:: instead of static::
#    - Note: Some tests may intentionally use self:: for specific reasons
#    - Can be addressed incrementally

